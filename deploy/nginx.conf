# =============================================================================
# Frontend-only nginx config for demo-dog
#
# Serves the Vite-built React SPA on :80 and reverse-proxies /api to a backend
# service discoverable via the "backend" hostname (used in docker-compose).
# =============================================================================

upstream dog_backend {
    server backend:8080;
    keepalive 16;
}

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip everything text-ish
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 256;

    # /api → backend collector
    location /api/ {
        proxy_pass         http://dog_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection           "";
        proxy_set_header   Host                 $host;
        proxy_set_header   X-Real-IP            $remote_addr;
        proxy_set_header   X-Forwarded-For      $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto    $scheme;
        proxy_read_timeout 60s;
    }

    # WebSocket upgrade for /api/stream
    location /api/stream {
        proxy_pass         http://dog_backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade              $http_upgrade;
        proxy_set_header   Connection           "upgrade";
        proxy_set_header   Host                 $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SPA fallback — every other path serves index.html so client-side routing works.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache static assets (Vite emits hashed filenames).
    location /assets/ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Light health endpoint for the docker healthcheck.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}

replicaCount: 2
image:
  repository: ghcr.io/zsy619/demo-dog
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "9100"
  prometheus.io/path: "/metrics"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  fsGroup: 10001

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  ingestPort: 8080
  adminPort: 9100

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: demo-dog.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 100m
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

persistence:
  enabled: true
  size: 20Gi
  storageClass: ""

nodeSelector: {}
tolerations: []
affinity: {}

# Round 52 — replicas list (used by the StatefulSet-style headless
# service when persistence.enabled=true).
replicas: 2

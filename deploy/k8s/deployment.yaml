# Kubernetes deployment for demo-dog collector.
#
# Round 52 production manifest. Two replicas behind a single
# service. StatefulSet-friendly data volume via PVC. Liveness
# + readiness probes hit the admin port.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-dog
  labels:
    app: demo-dog
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo-dog
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: demo-dog
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: collector
          image: ghcr.io/zsy619/demo-dog:latest
          imagePullPolicy: IfNotPresent
          args:
            - -addr=:8080
            - -admin-addr=:9100
            - -data-dir=/var/lib/demo-dog
            - -workers=8
            - -replication-peers=http://demo-dog-0.demo-dog-headless:8080
          ports:
            - name: ingest
              containerPort: 8080
            - name: admin
              containerPort: 9100
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9100
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: 9100
            initialDelaySeconds: 3
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/demo-dog
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: demo-dog
spec:
  type: ClusterIP
  selector:
    app: demo-dog
  ports:
    - name: ingest
      port: 8080
      targetPort: 8080
    - name: admin
      port: 9100
      targetPort: 9100

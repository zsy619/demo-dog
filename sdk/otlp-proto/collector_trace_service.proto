// OpenTelemetry Trace Service gRPC contract for the demo-dog collector.
//
// This is a vendored copy of the OTel trace_service.proto definition,
// trimmed to only the RPCs and messages we actually implement. It is
// NOT meant to be regenerated; the in-house OTLP/HTTP endpoint is the
// wire we serve today. A future round can spin up a grpc.Server using
// these definitions and the same OTLP envelope decoder.
//
//   Source: github.com/open-telemetry/opentelemetry-proto v1.4.0
//   License: Apache-2.0
//
// To enable gRPC ingest in the future:
//   1. protoc --go_out=. -I. collector_trace_service.proto
//   2. implement the TraceService_ExportServer interface
//   3. translate otlp.TraceServiceRequest -> demo-dog OTLPRequest
//   4. wire grpc.NewServer().Serve(listener)
//
// The collector already understands the OTLP envelope from
// /v1/traces, so the translation is mechanical.

syntax = "proto3";

package opentelemetry.proto.collector.trace.v1;

service TraceService {
  // Export exports a batch of spans.
  rpc Export(ExportTraceServiceRequest) returns (ExportTraceServiceResponse) {};
}

message ExportTraceServiceRequest {
  // An array of ResourceSpans.
  // For a single Resource, multiple batched exports can be sent in one
  // Export request.
  repeated ResourceSpans resource_spans = 1;
}

message ExportTraceServiceResponse {
  ExportTracePartialSuccess partial_success = 1;
}

message ExportTracePartialSuccess {
  // The number of dropped spans.
  int64 dropped_spans = 1;

  // A more detailed error message for failed rejections.
  string error_message = 2;
}

// A collection of ScopeSpans from a Resource.
message ResourceSpans {
  // The resource for the spans in this message.
  // A Resource is a document that captures the identity of the entity
  // producing the telemetry data.
  Resource resource = 1;

  // A list of ScopeSpans that originate from a resource.
  repeated ScopeSpans scope_spans = 2;

  // The Schema URL, if known. This is the identifier of the resource schema.
  string schema_url = 3;
}

// A collection of Spans produced by a scope.
message ScopeSpans {
  // The instrumentation scope information for the spans in this message.
  Scope scope = 1;

  // A list of Spans that originate from the specified scope.
  repeated Span spans = 2;

  // The Schema URL, if known. This is the identifier of the
  // instrumentation scope schema.
  string schema_url = 3;
}

message Resource {
  // Set of attributes that describe the resource.
  // Attribute keys MUST be unique (it is not allowed to have more
  // than one attribute with the same key).
  repeated KeyValue attributes = 1;

  // The number of dropped attributes. If the value is 0, then
  // no attributes were dropped.
  uint32 dropped_attributes_count = 2;
}

message Scope {
  // An instrumentation scope name. This may be the library name or
  // something similar.
  string name = 1;
  // An instrumentation scope version.
  string version = 2;
  // Additional attributes that describe the scope.
  repeated KeyValue attributes = 3;
  // The number of dropped attributes. If the value is 0, then
  // no attributes were dropped.
  uint32 dropped_attributes_count = 4;
}

message KeyValue {
  string key = 1;
  AnyValue value = 2;
}

message AnyValue {
  oneof value {
    string string_value = 1;
    bool bool_value = 2;
    int64 int_value = 3;
    double double_value = 4;
    ArrayValue array_value = 5;
    KeyValueList kvlist_value = 6;
    bytes bytes_value = 7;
  }
}

message ArrayValue {
  repeated AnyValue values = 1;
}

message KeyValueList {
  repeated KeyValue values = 1;
}

message Span {
  // Unique identifier for the trace.
  bytes trace_id = 1;
  // Unique identifier for the span within the scope of the trace.
  bytes span_id = 2;
  // Trace state associated with the span.
  string trace_state = 3;
  // The span kind.
  SpanKind kind = 4;
  // The start time of the span.
  fixed64 start_time_unix_nano = 5;
  // The end time of the span.
  fixed64 end_time_unix_nano = 6;
  // Attributes associated with the span.
  repeated KeyValue attributes = 7;
  // The number of dropped attributes.
  uint32 dropped_attributes_count = 8;
  // Events associated with the span.
  repeated Event events = 9;
  // The number of dropped events.
  uint32 dropped_events_count = 10;
  // Links associated with the span.
  repeated Link links = 11;
  // The number of dropped links.
  uint32 dropped_links_count = 12;
  // The status of the span.
  Status status = 13;

  enum SpanKind {
    SPAN_KIND_UNSPECIFIED = 0;
    SPAN_KIND_INTERNAL = 1;
    SPAN_KIND_SERVER = 2;
    SPAN_KIND_CLIENT = 3;
    SPAN_KIND_PRODUCER = 4;
    SPAN_KIND_CONSUMER = 5;
  }
}

message Event {
  fixed64 time_unix_nano = 1;
  string name = 2;
  repeated KeyValue attributes = 3;
  uint32 dropped_attributes_count = 4;
}

message Link {
  bytes trace_id = 1;
  bytes span_id = 2;
  string trace_state = 3;
  repeated KeyValue attributes = 4;
  uint32 dropped_attributes_count = 5;
  uint32 flags = 6;
}

message Status {
  string message = 2;
  StatusCode code = 3;

  enum StatusCode {
    STATUS_CODE_UNSET = 0;
    STATUS_CODE_OK = 1;
    STATUS_CODE_ERROR = 2;
  }
}

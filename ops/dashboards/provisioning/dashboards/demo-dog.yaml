apiVersion: 1

# Grafana dashboard provisioning for demo-dog.
# Drop this into /etc/grafana/provisioning/dashboards/.
# Grafana will auto-import all dashboards in the `path` directory.

providers:
  - name: demo-dog
    orgId: 1
    folder: demo-dog
    type:      file
    disableDeletion: false
    updateIntervalSeconds: 60
    allowUiUpdates: true
    options:
      # Path inside the Grafana container. Mount your repo or copy
      # the dashboard JSONs in.
      path: /var/lib/grafana/dashboards/demo-dog
      foldersFromFilesStructure: false

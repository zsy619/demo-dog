apiVersion: 1

# Grafana datasource provisioning for demo-dog.
# Drop this file into /etc/grafana/provisioning/datasources/
# (or wherever $GF_PATHS_PROVISIONING points to) and restart
# Grafana. The data source will appear under the name "demo-dog".
#
# Demo-dog exposes a Prometheus-compatible /api/v1/query endpoint
# so we configure it as a Prometheus datasource. This means every
# PromQL panel you build against this datasource works exactly
# like a panel against vanilla Prometheus or Cortex/Thanos.

datasources:
  - name: demo-dog
    type: prometheus
    access: proxy
    # Default URL works when Grafana runs in the same docker-compose
    # stack as demo-dog. Override per-environment via the
    # secureJsonData + env-var injection pattern (see Grafana docs).
    url: http://demo-dog-collector:8088
    isDefault: true
    editable: true
    jsonData:
      # demo-dog's /api/v1/query does NOT need any extra params for
      # time-range handling. Standard Prometheus query path works.
      httpMethod: POST
      # The default scrape interval. demo-dog serves historical
      # queries so this is informational; set to match your refresh.
      timeInterval: 30s
      # Send a W3C-compatible trace header so the demo-dog collector
      # stitches dashboard requests into a trace.
      customHeaders: '{"X-Dog-Source":"grafana"}'

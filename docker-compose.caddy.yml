# =============================================================================
# docker-compose.caddy.yml -- demo-dog full stack using Caddy instead of nginx
# =============================================================================
#
# Same topology as docker-compose.yml, but the frontend image is built from
# deploy/Dockerfile.caddy and ships a Caddyfile in place of nginx.conf.
#
# Usage:
#   docker compose -f docker-compose.caddy.yml up --build
#   docker compose -f docker-compose.caddy.yml down
#
# =============================================================================

name: demo-dog-caddy

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    image: demo-dog-backend:0.1.0
    container_name: demo-dog-backend
    restart: unless-stopped
    ports:
      - "18080:8080"
    environment:
      GIN_MODE: release
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 3s

  frontend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.caddy
      args:
        CADDYFILE: Caddyfile
        LISTEN_PORT: "80"
    image: demo-dog-frontend-caddy:0.1.0
    container_name: demo-dog-frontend-caddy
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3

networks:
  default:
    name: demo-dog-net-caddy

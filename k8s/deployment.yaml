apiVersion: apps/v1
kind: Deployment
metadata:
  name: dog-collector
  namespace: observability
  labels:
    app.kubernetes.io/name: dog-collector
    app.kubernetes.io/part-of: demo-dog
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: dog-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dog-collector
      annotations:
        # Force a rolling restart when ConfigMap changes.
        checksum/config: REPLACE_WITH_CHECKSUM
    spec:
      # Spread replicas across zones for availability.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: dog-collector
      containers:
        - name: dog-collector
          image: ghcr.io/zsy619/dog-collector:v0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 8080
          env:
            - name: DOG_API_KEYS
              valueFrom:
                secretKeyRef:
                  name: dog-collector-secrets
                  key: api-keys
            - name: GOMAXPROCS
              valueFrom:
                resourceFieldRef:
                  resource: limits.cpu
                  divisor: "1"
          args:
            - -addr=:8080
            - -workers=8
            - -queue=4096
            - -snapshot=/var/lib/dog-collector/state.snap
            - -pprof-token=$(PPROF_TOKEN)
            - -self-trace=true
          envFrom:
            - secretRef:
                name: dog-collector-secrets
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/probe
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 0
            periodSeconds: 5
            failureThreshold: 30
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: state
              mountPath: /var/lib/dog-collector
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: dog-collector-state
        - name: tmp
          emptyDir: {}
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: dog-collector
  namespace: observability
  labels:
    app.kubernetes.io/name: dog-collector
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: metrics
      port: 9090
      targetPort: http
  selector:
    app.kubernetes.io/name: dog-collector
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: dog-collector
  namespace: observability
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: dog-collector
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
    scaleUp:
      stabilizationWindowSeconds: 30
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: dog-collector
  namespace: observability
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dog-collector
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dog-collector-state
  namespace: observability
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
  storageClassName: standard
